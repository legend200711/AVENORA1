name: Deploy Avenora to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Disable Jekyll processing — this is a vanilla JS SPA, not a Jekyll site.
          # Without this, GitHub Pages runs Jekyll on the repo root and strips src/.
          enablement: false

      - name: Add .nojekyll to prevent Jekyll processing
        # Belt-and-suspenders: also add .nojekyll inside frontend/ so that if
        # Jekyll ever runs it won't transform the static app or ignore _prefixed paths.
        run: touch frontend/.nojekyll

      - name: Upload frontend as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy the frontend/ directory — the real Avenora app entry point.
          # frontend/index.html is the actual app (not the README).
          # No build step needed — this is a vanilla JS SPA.
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
