<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVENORA — Offline</title>
  <style>
    :root {
      --gold:    #b8954b;
      --bronze:  #76552f;
      --ivory:   #eee4cf;
      --muted:   #6b5e4e;
      --bg:      #090807;
      --stone:   #292521;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ivory);
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 480px; }
    .brand {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--gold), var(--ivory), var(--bronze));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .tagline {
      font-size: 0.75rem;
      letter-spacing: 0.28em;
      color: var(--bronze);
      text-transform: uppercase;
      margin-bottom: 48px;
    }
    .icon { font-size: 4rem; margin-bottom: 24px; }
    h2 { font-size: 1.4rem; margin-bottom: 12px; color: var(--ivory); }
    p  { color: var(--muted); line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border: 1px solid var(--bronze);
      background: transparent;
      color: var(--gold);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 8px;
      cursor: pointer;
      transition: background 200ms, box-shadow 200ms;
    }
    .btn:hover {
      background: rgba(184,149,75,0.10);
      box-shadow: 0 0 18px rgba(184,149,75,0.25);
    }
    .ornament {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--bronze), transparent);
      margin: 0 auto 32px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">AVENORA</div>
    <div class="tagline">A PLACE WHERE EVERYONE BELONGS</div>
    <div class="ornament"></div>
    <div class="icon">🏺</div>
    <h2>You're Offline</h2>
    <p>Avenora requires a connection for most features. Check your network connection and try again.</p>
    <button class="btn" onclick="location.reload()">↻ Try Again</button>
  </div>
</body>
</html>
